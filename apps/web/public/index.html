<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0d1013" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="2nk 德州扑克 · 手机端牌桌" />
  <title>2nk 德州扑克</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./css/app.css" />
  <style>
    /* 只在登录阶段铺背景。body[data-phase] 是 app.js 设置的；
       页面刚打开、app.js 还没跑完时还没有这个属性，所以补一档 :not([data-phase])，
       否则会先闪一下纯黑底再出图 */
    body[data-phase='login'],
    body:not([data-phase]) {
      background-color: #0d1013;
      background-image:
        /* 遮罩只压暗下半部分：上面留空，背景里的「2NK poker」才能原样看清 */
        linear-gradient(
          180deg,
          rgba(6, 11, 8, 0) 0%,
          rgba(6, 11, 8, 0) 32%,
          rgba(6, 11, 8, 0.5) 58%,
          rgba(6, 11, 8, 0.75) 100%
        ),
        url('./img/login-bg.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
    }

    /* ---------- 手机横屏（高度不足 560）：卡片顶部留白 36vh ----------
       横屏走 cover，这行字实测落在视口高度的 20%~32%，36vh 能完整让开 */
    @media (orientation: landscape) {
      body[data-phase='login'] .view-login,
      body:not([data-phase]) .view-login {
        justify-content: flex-start;
        padding-top: 36vh;
      }
    }

    /* ---------- 电脑 / 平板横屏 ----------
       上块（用户名 + 进入大厅）：恢复上一步的位置——顶部对齐、水平居中、不缩放
       下块（或 + 离线练习 + 后端状态 + 高级设置）：单独挪到右上角，整体缩到 80%
       min-width: 1000px 是为了保证右上角那块不会横向压到背景里居中的那行字 */
    @media (orientation: landscape) and (min-width: 1000px) and (min-height: 560px) {
      body[data-phase='login'] .view-login,
      body:not([data-phase]) .view-login {
        justify-content: flex-start;
        padding-top: 36vh;             /* 32vh 再下移 4vh（900 高的窗口约 36px），正好让开背景那行字的下缘 */
      }

      /* 下块挪走以后，上块要恢复成一张完整的卡片：补回下边框、四角圆角和下内边距；
         再放大 10%（以顶边中点为原点，所以不会往下跑、也不会偏心） */
      body[data-phase='login'] .view-login .login-card,
      body:not([data-phase]) .view-login .login-card {
        padding-bottom: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;
        box-shadow: var(--shadow);
        transform: scale(1.1);
        transform-origin: top center;
      }

      /* 下块单独成一张卡片，放右上角、缩到 80%、比原来上移 12px */
      body[data-phase='login'] .login-side,
      body:not([data-phase]) .login-side {
        position: absolute;            /* 相对 #views 定位（它有 position: relative），也就是整个视口 */
        top: 44px;                     /* 原来是 56px；再往上会顶到右上角那个「布局」按钮 */
        right: 22px;
        margin: 0;                     /* 取消 margin: 0 auto，否则会被拉回中间 */
        padding-top: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;
        transform: scale(0.8);         /* 整体缩小，字和按钮一起缩 */
        transform-origin: top right;
      }

      /* 右上那块里不需要「或」这条分隔线（手机端两块连着，仍然要它分隔两个按钮，
         所以只在这里隐藏；想彻底去掉就改 js/views/login.js） */
      body[data-phase='login'] .login-side .divider,
      body:not([data-phase]) .login-side .divider {
        display: none;
      }
    }

    /* 手机竖屏：换成一张竖版(9:16)的图，直接 cover 铺满整屏。
       图上「2NK poker」在图片高度的 17%~21%，所以渐变只压暗下半部分：
       上半部分不压暗（字保持原亮度），卡片所在的下面一段压暗给卡片当底 */
    @media (orientation: portrait) {
      body[data-phase='login'],
      body:not([data-phase]) {
        background-image:
          linear-gradient(
            180deg,
            rgba(6, 11, 8, 0) 0%,
            rgba(6, 11, 8, 0.1) 26%,
            rgba(6, 11, 8, 0.55) 42%,
            rgba(6, 11, 8, 0.85) 100%
          ),
          url('./img/login-bg-phone.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center center;
      }

      /* 卡片整体下移到底部。margin-top: auto 在还有空间时把卡片推到底，
         空间不够时它自动变成 0，卡片照常从上往下排、可以滚，不会像 justify-content: flex-end 那样把顶部裁掉 */
      body[data-phase='login'] .view-login,
      body:not([data-phase]) .view-login {
        justify-content: flex-start;
      }
      body[data-phase='login'] .login-card,
      body:not([data-phase]) .login-card {
        margin-top: auto;
        margin-bottom: 0;
      }
      /* 再整体上移一点：给最后一块（下半块）留个底部外边距，915 高的手机约 6vh≈55px。
         想更靠上就把 6vh 调大；想回到贴底就删掉这条 */
      body[data-phase='login'] .login-side,
      body:not([data-phase]) .login-side {
        margin-bottom: 6vh;
      }
    }

    /* 登录卡片现在拆成上下两块（见 js/views/login.js）：
       上块 = 品牌 + 提示 + 用户名 + 进入大厅；下块 = 或 + 离线练习 + 后端状态 + 高级设置。
       默认两块贴合在一起、看起来仍是一整张卡片（所以上块只去掉下边框、下块只去掉上边框）；
       电脑端由下面那条 @media 把下块单独挪到右上角并缩小。
       嫌不够透就把 0.4 调小（0 = 全透明）。
       这里不用 backdrop-filter 毛玻璃：它要给每块卡片各开一块离屏图层、每帧重算模糊，
       而卡片本来就只有 0.4 不透明度，有没有模糊观感差别很小，省掉更划算 */
    .view-login .login-card {
      max-width: 340px;
      padding: 16px 14px 0;                            /* 下内边距交给 login-side，两块之间才不会留双份空隙 */
      background: rgba(12, 16, 21, 0.4);
      border-color: rgba(255, 255, 255, 0.14);
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.35);     /* 阴影只往上投，接缝处才不会露出一条暗带 */
    }

    .view-login .login-side {
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      padding: 0 14px 16px;
      background: rgba(12, 16, 21, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-top: 0;
      border-radius: 0 0 18px 18px;
      box-shadow: var(--shadow);
    }

    /* ---------- 牌局大厅的背景照片 ----------
       body[data-phase='lobby'] 同样由 app.js 设置，只在大厅这一屏生效，
       不影响等待室/牌桌。图片：public/img/lobby-bg.jpg（1080×1441，104 KB）
       background-size: cover = 保持长宽比铺满，多出来的部分裁掉；
       想让整张照片都露出来、两侧留底色，把 cover 改成 contain 即可。
       上面那层渐变是遮罩：房间列表/卡片是深色主题，照片不压暗会太亮。嫌暗就调小这两个数 */
    body[data-phase='lobby'] {
      background-color: #0d1013;
      background-image:
        linear-gradient(rgba(10, 13, 18, 0.62), rgba(10, 13, 18, 0.78)),
        url('./img/lobby-bg.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
    }

    /* 大厅里的面板卡（列表面板的「用房号加入」+「创建牌局」面板那张）：
       宽度跟上面的页签 / 面板对齐。
       原因：app.css 里 .card 这个名字定义了两遍——
         L278 是面板容器（深底 + 14px 内边距），
         L911 是牌桌上的扑克牌（display: inline-grid + 白底 + place-items: center），
       后者在后面所以赢了，大厅这两张面板卡被当扑克牌渲染：宽度缩成内容宽、还带上白底。
       这里把大厅里的 .card 改回块级 + 撑满；牌桌那边的扑克牌不受影响
       （大厅里没有扑克牌，所以这条不会误伤） */
    .view-lobby .card {
      display: block;
      width: 100%;
    }

    /* ---------- 等待室的背景轮播 ----------
       6 张照片叠 6 层，每 6 秒交叉淡入淡出一张（切换逻辑在 js/views/waiting.js）。
       尺寸/位置用 cover（保持长宽比铺满，多出的裁掉）；
       上面压一层遮罩，保证等待室里的卡片和文字看得清——嫌暗就把 0.5/0.7 调小 */
    .view-waiting .waiting-bg {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 0;
      overflow: hidden;
      background: #0d1013;
    }

    .view-waiting .waiting-bg::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(rgba(10, 13, 18, 0.5), rgba(10, 13, 18, 0.7));
    }

    .view-waiting .waiting-bg-slide {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.4s ease;
    }

    .view-waiting .waiting-bg-slide.is-active {
      opacity: 1;
    }

    /* 内容要盖在背景照片上面 */
    .view-waiting > .app-header,
    .view-waiting > .waiting-body {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- 固定工具条：布局切换（竖屏 / 横屏 / 自动）与连接状态 -->
  <div id="toolbar"></div>

  <!-- 未捕获错误的提示条：任何失败都要在界面上看得见，避免"点了没反应" -->
  <div id="error-banner" role="alert"></div>

  <!-- 视图容器：登录 / 大厅 / 等待室 / 牌桌，同一时刻只有一个可见 -->
  <main id="views">
    <!-- 启动占位：app.js 接管后会被替换掉；若它没能加载，下面会显示原因 -->
    <section class="view view-active" id="boot-placeholder">
      <div class="login-card">
        <div class="brand">
          <div class="brand-mark">♠</div>
          <div class="brand-text">
            <h1>2nk 德州扑克</h1>
            <p id="boot-status">正在加载…</p>
          </div>
        </div>
        <div id="boot-error" class="boot-error"></div>
      </div>
    </section>
  </main>

  <!-- toast 提示挂载点 -->
  <div id="toast"></div>

  <noscript>
    <p style="padding: 20px; color: #eee">这个页面需要启用 JavaScript。</p>
  </noscript>

  <!--
    启动兜底：这段内联脚本不依赖任何模块，必须放在 app.js 之前。
    只要 app.js 没能在 4 秒内把 window.__poker 挂上，就把可能的原因直接显示出来
    （file:// 打开、模块加载失败、脚本被拦截等），避免"点了没反应又没报错"。
  -->
  <script>
    (function () {
      var timer = setTimeout(function () { show(''); }, 4000);

      window.addEventListener('error', function (ev) {
        var t = ev.target;
        if (t && t.tagName === 'SCRIPT') {
          clearTimeout(timer);
          show('脚本加载失败：' + (t.src || '(inline)'));
        } else if (ev.error && ev.message) {
          // 真正的 JS 运行时错误（资源加载失败不会带 ev.error）
          show('脚本报错：' + ev.message);
        }
      }, true);

      function show(extra) {
        if (window.__poker) return;                 // 已正常启动
        var box = document.getElementById('boot-error');
        if (!box || box.dataset.shown) return;
        box.dataset.shown = '1';

        var lines = [];
        if (location.protocol === 'file:') {
          lines.push('你是用 file:// 直接打开的，浏览器会拒绝加载 ES 模块。');
          lines.push('请在项目根目录执行：node apps/web/dev-server.mjs');
          lines.push('然后访问 http://localhost:8080');
        } else {
          lines.push('页面没能启动：app.js 没有加载成功。');
          lines.push('请打开浏览器控制台（F12）查看红色错误，并确认 ' + location.origin + '/js/app.js 能打开。');
        }
        if (extra) lines.push(extra);

        var status = document.getElementById('boot-status');
        if (status) status.textContent = '启动失败';
        box.innerHTML = lines.map(function (t) { return '<div>· ' + t + '</div>'; }).join('');
        box.classList.add('visible');
      }
    })();
  </script>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
